<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb; --card:#fff; --line:#e5eaf3; --text:#0f172a; --muted:#6b7a90;
  --brand:#4f46e5; --soft:#f8fafc;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased;
}
.app{display:flex;flex-direction:column;height:100vh}

/* ---------- top bar ---------- */
.topbar{
  height:64px;flex:0 0 64px;display:flex;align-items:center;gap:20px;
  padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.logo{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px;
  box-shadow:0 3px 10px rgba(79,70,229,.28);
}
.brand h1{font-size:14.5px;font-weight:700;letter-spacing:.2px;line-height:1.25}
.brand p{font-size:11px;color:var(--muted);margin-top:1px}

.tabs{display:flex;gap:4px;background:#f1f4fa;padding:4px;border-radius:10px;flex:0 0 auto}
.tabs button{
  border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:7px 15px;border-radius:7px;cursor:pointer;transition:.16s;white-space:nowrap;
}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.1)}

.spacer{flex:1}
.search{position:relative;flex:0 0 auto}
.search input{
  width:210px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 32px;
  font:inherit;font-size:12.5px;background:var(--soft);outline:none;transition:.16s;color:var(--text);
}
.search input:focus{border-color:#c7d2fe;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.09);width:240px}
.search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;stroke:#94a3b8;fill:none;stroke-width:2}
.btn{
  height:34px;padding:0 13px;border:1px solid var(--line);background:#fff;border-radius:9px;
  font:inherit;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:hover{border-color:#c7d2fe;color:var(--brand);background:#fafaff}

/* back link to article */
.backlink{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;color:#64748b;text-decoration:none;
  padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;
  transition:.16s;
}
.backlink:hover{color:var(--brand);border-color:#c7d2fe;background:#fafaff}

/* mobile legend strip + hint */
.mlegend{display:none}
.mhint{display:none}

/* mobile detail sheet */
.sheet-bar{display:none}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#d5dce8;margin:0 auto 2px}
.sheet-close{
  border:0;background:#f1f4fa;color:#64748b;font:inherit;font-size:11.5px;font-weight:600;
  padding:5px 12px;border-radius:7px;cursor:pointer;
}
.sheet-close:hover{background:#e6ecf7;color:var(--brand)}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
.panel{
  background:var(--card);overflow-y:auto;flex:0 0 auto;padding:16px 14px;
}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:#dbe2ee;border-radius:3px}
.panel.left{width:216px;border-right:1px solid var(--line)}
.panel.right{width:308px;border-left:1px solid var(--line)}
.sec{margin-bottom:20px}
.sec-title{
  font-size:10.5px;font-weight:700;color:#94a3b8;letter-spacing:1.1px;text-transform:uppercase;
  margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;
}
.sec-title span{font-weight:600;letter-spacing:0;text-transform:none;font-size:10px;color:#b6c2d4}

/* legend */
.leg{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;cursor:pointer;transition:.14s;margin-bottom:1px}
.leg:hover{background:var(--soft)}
.leg.off{opacity:.35}
.leg .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.leg .nm{font-size:12px;font-weight:500;flex:1}
.leg .ct{font-size:10.5px;color:#b6c2d4;font-variant-numeric:tabular-nums}

/* stats */
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed #eef2f8}
.stat:last-child{border:0}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

.hint{
  font-size:10.5px;color:#94a3b8;line-height:1.85;background:var(--soft);
  border:1px solid #eef2f8;border-radius:8px;padding:9px 10px;
}
.hint b{color:#64748b;font-weight:600}

/* stage */
#stage{flex:1;position:relative;overflow:hidden;min-width:0;
  background:
    radial-gradient(circle at 1px 1px,#dde4f0 1px,transparent 0) 0 0/22px 22px,
    linear-gradient(180deg,#fbfcff,#f7f9fd);
}
#graph{width:100%;height:100%;display:block;touch-action:none}
.toolbar{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);padding:5px;border-radius:10px;
  border:1px solid var(--line);box-shadow:0 4px 14px rgba(15,23,42,.06)}
.toolbar button{
  border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:600;color:#64748b;
  padding:6px 11px;border-radius:6px;cursor:pointer;transition:.14s;
}
.toolbar button:hover{background:#eef2ff;color:var(--brand)}
.zoombadge{
  position:absolute;left:14px;bottom:14px;font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.85);padding:5px 10px;border-radius:7px;border:1px solid var(--line);
}

/* node / link */
.link{stroke:#cfd8e8;stroke-width:1.1;fill:none;transition:opacity .18s}
.link.hi{stroke:#a5b4fc;stroke-width:2}
.node{cursor:grab}
.node:active{cursor:grabbing}
.node circle{transition:opacity .18s,stroke-width .18s}
.node text{
  font-size:11px;font-weight:500;fill:#334155;text-anchor:middle;
  paint-order:stroke;stroke:#fbfcff;stroke-width:3.2px;stroke-linejoin:round;
  pointer-events:none;user-select:none;transition:opacity .18s;
}
.node.d1 text{font-size:12.5px;font-weight:700;fill:#1e293b}
.node.d0 text{font-size:15px;font-weight:800;fill:#0f172a;letter-spacing:.3px}
.node.dim circle,.node.dim text{opacity:.13}
.node.hit circle{stroke:#4f46e5;stroke-width:3}
.node.sel circle{stroke:#4f46e5;stroke-width:3.5}
.ring{fill:none;stroke:#4f46e5;stroke-width:1.5;opacity:.55}

/* detail */
.d-empty h3{font-size:13.5px;font-weight:700;margin-bottom:8px}
.d-empty p{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.d-title{font-size:16px;font-weight:750;line-height:1.4;margin-bottom:8px;letter-spacing:.2px}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  padding:3px 9px;border-radius:20px;margin-bottom:12px;
}
.badge i{width:6px;height:6px;border-radius:50%;display:block}
.d-desc{font-size:12.5px;line-height:1.9;color:#3f4d63;margin-bottom:14px}
.d-meta{font-size:12px;line-height:1.85;color:#475569;background:var(--soft);border:1px solid #eef2f8;
  border-radius:9px;padding:10px 12px;margin-bottom:14px}
.d-meta b{color:#0f172a;font-weight:700}
.kw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.kw span{font-size:10.5px;background:#eef2ff;color:#4f46e5;padding:3px 8px;border-radius:5px;font-weight:600}
.rel-title{font-size:10.5px;font-weight:700;color:#94a3b8;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.rel{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:.14s;font-size:12px}
.rel:hover{background:#f1f5ff;color:var(--brand)}
.rel i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.rel .dirmark{color:#cbd5e1;font-size:10px;margin-left:auto}

/* ---------- responsive ---------- */
body.clean .topbar,body.clean .panel,body.clean .toolbar,body.clean .zoombadge{display:none}
body.clean #stage{background:#ffffff}
@media (max-width: 1240px){
  .panel.left{width:186px;padding:14px 11px}
  .panel.right{width:270px}
  .search input{width:158px}
  .search input:focus{width:178px}
}
@media (max-width: 1080px){
  .panel.left{display:none}
  .brand p{display:none}
}
@media (max-width: 880px){
  .topbar{height:auto;flex:0 0 auto;flex-wrap:wrap;padding:9px 12px;gap:9px}
  .backlink{padding:5px 9px;font-size:11.5px}
  .brand{flex:1 1 auto;min-width:0}
  .brand h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{display:none}
  .btn{padding:0 9px;font-size:11.5px}
  .tabs{order:3;width:100%;overflow-x:auto;padding:3px;border-radius:9px}
  .tabs button{flex:1 0 auto;padding:6px 12px;font-size:11.5px}
  .search{order:4;width:100%}
  .search input,.search input:focus{width:100%}
  .spacer{display:none}

  /* detail panel becomes a bottom sheet */
  .panel.right{
    display:block;position:fixed;left:0;right:0;bottom:0;width:100%;
    max-height:64vh;border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:8px 16px 24px;
    box-shadow:0 -10px 34px rgba(15,23,42,.18);z-index:40;
    transform:translateY(104%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  body.sheet .panel.right{transform:translateY(0)}
  .sheet-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;
    position:sticky;top:0;background:#fff;padding:8px 0 6px;margin-bottom:4px;z-index:2}
  .sheet-grip{position:absolute;left:50%;transform:translateX(-50%);top:4px}
  .zoombadge{bottom:auto;top:12px;left:12px}
  .toolbar{bottom:auto;top:12px;right:12px}

  .mlegend{
    display:flex;gap:6px;position:absolute;left:10px;right:10px;top:60px;z-index:30;
    overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;
  }
  .mlegend::-webkit-scrollbar{display:none}
  .mlegend .leg{
    flex:0 0 auto;margin:0;padding:5px 11px;border-radius:20px;
    background:rgba(255,255,255,.94);border:1px solid var(--line);
    box-shadow:0 1px 4px rgba(15,23,42,.06);
  }
  .mlegend .leg .ct{display:none}
  .mlegend .leg .nm{font-size:11.5px}
  .mlegend .leg.off{opacity:.4}

  .mhint{
    display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
    background:rgba(15,23,42,.76);color:#fff;font-size:11.5px;font-weight:500;
    padding:7px 15px;border-radius:20px;white-space:nowrap;pointer-events:none;
    transition:opacity .25s;
  }
  body.sheet .mhint{opacity:0}
}
</style>
</head>

    ['e-eval','e-observe'],['e-eval','e-skills'],
    ['e-cost','e-aigw'],['e-cost','e-router'],
    ['e-sec','e-aigw'],['e-sec','e-sandbox'],['e-sec','e-mcpgw'],
    ['e-compliance','e-audit'],['e-compliance','e-sec'],
    ['e-devops','e-workflow'],['e-devops','e-prompt'],
    ['e-coe','e-observe'],['e-coe','e-eval']
  ]
};


/* ---------- state ---------- */
let G = null, NODES = [], LINKS = [], MAP = new Map(), ADJ = new Map();
let view = {s:1, x:0, y:0};
let sel = null, hover = null, activeCats = new Set(), q = '';
let nodeEls = new Map(), linkEls = [];

/* ---------- helpers ---------- */
function mk(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function catOf(id){ return G.cats.find(c => c.id === id) || {name:'其他', color:'#94a3b8'}; }

/* ---------- layout: radial (parent-anchored tree) ---------- */
function layoutRadial(){
  const root = NODES.find(n => n.root) || NODES[0];

  // BFS: build spanning tree
  NODES.forEach(n => { n.depth = Infinity; n.parent = null; n.ang = undefined; });
  root.depth = 0;
  const q = [root.id];
  const seen = new Set([root.id]);
  while(q.length){
    const cur = MAP.get(q.shift());
    const nbs = (ADJ.get(cur.id) || []).slice();
    for(const nb of nbs){
      const m = MAP.get(nb);
      if(m && !seen.has(nb)){
        seen.add(nb);
        m.depth = cur.depth + 1;
        m.parent = cur.id;
        q.push(nb);
      }
    }
  }
  NODES.forEach(n => { if(!seen.has(n.id)){ n.depth = 2; n.parent = root.id; } });
  root.x = 0; root.y = 0; root.ang = 0;

  // depth-1 nodes: one angular sector per category
  const cats = G.cats.map(c => c.id);
  const span = Math.PI * 2 / cats.length;
  const d1 = NODES.filter(n => n.depth === 1);
  cats.forEach((cid, ci) => {
    const arr = d1.filter(n => n.cat === cid);
    arr.forEach((n, i) => {
      const a = -Math.PI / 2 + ci * span + (((i + 0.5) / arr.length) - 0.5) * span * 0.82;
      n.ang = a;
      n.x = Math.cos(a) * 218;
      n.y = Math.sin(a) * 218;
    });
  });
  d1.forEach(n => { if(n.ang === undefined) n.ang = Math.atan2(n.y, n.x); });

  // recursive: children fan out around their parent
  function placeChildren(pid, guard){
    if(guard > 8) return;
    const kids = NODES.filter(n => n.parent === pid);
    if(!kids.length) return;
    const p = MAP.get(pid);
    const baseAng = p.ang !== undefined ? p.ang : Math.atan2(p.y, p.x);
    const spread = Math.min(1.75, 0.46 * kids.length);
    const dist = p.depth === 0 ? 218 : (p.depth === 1 ? 176 : 156);
    kids.forEach((k, i) => {
      const t = kids.length === 1 ? 0.5 : i / (kids.length - 1);
      const a = baseAng + (t - 0.5) * spread;
      k.ang = a;
      k.x = p.x + Math.cos(a) * dist;
      k.y = p.y + Math.sin(a) * dist;
    });
    kids.forEach(k => placeChildren(k.id, guard + 1));
  }
  d1.forEach(n => placeChildren(n.id, 0));

  // remember home positions, then relax gently so labels do not collide
  NODES.forEach(n => { n.hx = n.x; n.hy = n.y; });
  for(let it = 0; it < 130; it++){
    for(let i = 0; i < NODES.length; i++){
      for(let j = i + 1; j < NODES.length; j++){
        const a = NODES[i], b = NODES[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || .01;
        const minD = 66;
        if(d < minD){
          const f = (minD - d) / d * 0.34;
          const am = a.depth >= 2, bm = b.depth >= 2;
          if(am && bm){
            a.x -= dx * f; a.y -= dy * f;
            b.x += dx * f; b.y += dy * f;
          } else if(am){
            a.x -= dx * f * 1.7; a.y -= dy * f * 1.7;
          } else if(bm){
            b.x += dx * f * 1.7; b.y += dy * f * 1.7;
          }
        }
      }
    }
    for(const n of NODES){
      if(n.depth < 2) continue;
      n.x += (n.hx - n.x) * 0.16;
      n.y += (n.hy - n.y) * 0.16;
    }
  }
}

/* ---------- layout: layered (architecture) ---------- */
function layoutLayered(){
  const order = G.cats.map(c => c.id);
  const cols = order.map(c => NODES.filter(n => n.cat === c));
  const maxN = Math.max(1, ...cols.map(c => c.length));
  const colGap = 214;
  const rowGap = Math.min(88, 800 / Math.max(maxN, 4));
  const totalW = (order.length - 1) * colGap;
  const maxSpan = maxN * rowGap;

  cols.forEach((col, ci) => {
    const x = -totalW / 2 + ci * colGap;
    col.forEach((n, ri) => {
      n.x = x;
      n.y = (ri - (col.length - 1) / 2) * rowGap;
      n.depth = 1;
      n._col = ci;
      n.fx = x; n.fy = n.y;
    });
  });
  NODES.forEach(n => { if(n.root){ n.x = 0; n.y = -maxSpan / 2 - 90; n.fx = n.x; n.fy = n.y; } });

  G._lay = {
    cols: cols.map((col, ci) => ({x: -totalW / 2 + ci * colGap, cat: order[ci], n: col.length})),
    top: -maxSpan / 2 - 26,
    bottom: maxSpan / 2 + 26,
    w: 176
  };
}

/* keep labels from sitting on top of each other */
function resolveLabelCollisions(){
  const ctx = document.createElement('canvas').getContext('2d');
  const items = [];
  for(const n of NODES){
    if(n.root) continue;
    const fs = n.depth === 1 ? 12.5 : 11;
    ctx.font = (n.depth === 1 ? '700 ' : '500 ') + fs + 'px sans-serif';
    const w = ctx.measureText(n.label).width + 8;
    const r = n.size === 3 ? 15 : n.size === 2 ? 11 : 8;
    items.push({n, w, h: fs + 3, r, side: 1, lift: 0});
  }
  const boxOf = it => ({
    x: it.n.x,
    y: it.n.y + (it.side === 1 ? it.r + 14 + it.lift : -it.r - 6 - it.lift),
    w: it.w, h: it.h
  });
  for(let pass = 0; pass < 8; pass++){
    let moved = false;
    for(let i = 0; i < items.length; i++){
      for(let j = i + 1; j < items.length; j++){
        const a = items[i], b = items[j];
        const ba = boxOf(a), bb = boxOf(b);
        if(Math.abs(ba.x - bb.x) < (ba.w + bb.w) / 2 + 2 &&
           Math.abs(ba.y - bb.y) < (ba.h + bb.h) / 2 + 1){
          const t = a.n.depth >= b.n.depth ? a : b;
          if(t.side === 1 && t.lift === 0){ t.side = -1; }
          else { t.lift += 15; }
          moved = true;
        }
      }
    }
    if(!moved) break;
  }
  for(const it of items){
    const o = nodeEls.get(it.n.id);
    if(o) o.t.setAttribute('y', it.side === 1 ? it.r + 14 + it.lift : -it.r - 6 - it.lift);
  }
}

/* ---------- render ---------- */
let gLanes = null;

function render(){
  gLinks.innerHTML = ''; gNodes.innerHTML = '';
  nodeEls.clear(); linkEls = [];

  // swimlanes for layered layout
  if(G.layout === 'layered' && G._lay){
    if(!gLanes){ gLanes = mk('g', {'pointer-events':'none'}); vp.insertBefore(gLanes, gLinks); }
    gLanes.innerHTML = '';
    for(const c of G._lay.cols){
      const cat = catOf(c.cat);
      gLanes.appendChild(mk('rect', {
        x: c.x - G._lay.w / 2, y: G._lay.top,
        width: G._lay.w, height: G._lay.bottom - G._lay.top,
        rx: 14, fill: cat.color, 'fill-opacity': .05,
        stroke: cat.color, 'stroke-opacity': .18, 'stroke-width': 1
      }));
      const t = mk('text', {
        x: c.x, y: G._lay.top - 13, 'text-anchor': 'middle',
        'font-size': 12.5, 'font-weight': 700, fill: cat.color,
        'font-family': 'inherit'
      });
      t.textContent = cat.name;
      gLanes.appendChild(t);
    }
  } else if(gLanes){ gLanes.remove(); gLanes = null; }

  // links
  for(const [s, t] of LINKS){
    const a = MAP.get(s), b = MAP.get(t);
    if(!a || !b) continue;
    const dc = (a._col !== undefined && b._col !== undefined) ? Math.abs(a._col - b._col) : 0;
    const far = dc > 2;
    const attrs = {
      x1:a.x, y1:a.y, x2:b.x, y2:b.y,
      stroke: far ? '#dde4f0' : '#cfd8e8', 'stroke-width':1.1, class:'link'
    };
    if(far) attrs['stroke-dasharray'] = '3 4';
    const line = mk('line', attrs);
    gLinks.appendChild(line);
    linkEls.push({el:line, s, t});
  }

  // nodes
  for(const n of NODES){
    const cat = catOf(n.cat);
    const r = n.root ? 26 : (n.size === 3 ? 15 : n.size === 2 ? 11 : 8);
    const g = mk('g', {class:'node d' + (n.root ? 0 : Math.min(n.depth,3)), transform:`translate(${n.x},${n.y})`});
    g.dataset.id = n.id;

    const c = mk('circle', {
      r: r,
      fill: n.root ? '#0f172a' : cat.color,
      'fill-opacity': n.root ? 1 : (n.depth === 3 ? .82 : 1),
      stroke:'#ffffff', 'stroke-width': n.root ? 3 : 2
    });
    g.appendChild(c);

    const label = n.label;
    const ty = n.root ? 42 : r + 14;
    const fs = n.root ? 15 : (n.depth === 1 ? 12.5 : 11);
    const t = mk('text', {
      x: 0, y: ty,
      'text-anchor': 'middle',
      'font-size': fs,
      'font-weight': n.root ? 800 : (n.depth === 1 ? 700 : 500),
      'font-family': '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
      fill: n.root ? '#0f172a' : (n.depth === 1 ? '#1e293b' : '#334155'),
      'paint-order': 'stroke', stroke: '#fbfcff', 'stroke-width': 3.2, 'stroke-linejoin': 'round'
    });
    t.textContent = label;
    g.appendChild(t);

    gNodes.appendChild(g);
    nodeEls.set(n.id, {g, c, t, n});
  }
  resolveLabelCollisions();
  applyView();
  updateHighlight();
  updateZoomBadge();
}

/* ---------- view ---------- */
function applyView(){
  vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`);
  updateZoomBadge();
}
function updateZoomBadge(){
  const zb = $('#zb'); if(zb) zb.textContent = Math.round(view.s * 100) + '%';
}
function fit(){
  if(!NODES.length) return;
  const padX = G.layout === 'layered' ? 100 : 72;
  const padTop = G.layout === 'layered' ? 80 : 34;
  const padBot = G.layout === 'layered' ? 80 : 40;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for(const n of NODES){
    minX = Math.min(minX, n.x - padX); maxX = Math.max(maxX, n.x + padX);
    minY = Math.min(minY, n.y - padTop); maxY = Math.max(maxY, n.y + padBot);
  }
  const W = svg.clientWidth, H = svg.clientHeight;
  const s = Math.min(W / (maxX - minX), H / (maxY - minY)) * 0.94;
  view.s = Math.max(.15, Math.min(2.2, s));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  view.x = W / 2 - cx * view.s;
  view.y = H / 2 - cy * view.s;
  applyView();
}

/* ---------- highlight ---------- */
function visible(n){
  if(activeCats.size && !activeCats.has(n.cat) && !n.root) return false;
  return true;
}
function updateHighlight(){
  const focus = hover || sel;
  const nb = new Set();
  if(focus){
    nb.add(focus);
    for(const x of (ADJ.get(focus) || [])) nb.add(x);
  }
  const ql = q.trim().toLowerCase();
  for(const [id, o] of nodeEls){
    const n = o.n;
    let dim = false;
    if(!visible(n)) dim = true;
    if(focus && !nb.has(id)) dim = true;
    if(ql && !(n.label.toLowerCase().includes(ql) || (n.k || []).join(' ').toLowerCase().includes(ql))) dim = true;
    o.g.setAttribute('opacity', dim ? .1 : 1);
    o.g.classList.toggle('hit', !!ql && !dim && !focus);
    o.g.classList.toggle('sel', sel === id);
  }
  for(const l of linkEls){
    const on = focus ? (l.s === focus || l.t === focus) : true;
    const vis = visible(MAP.get(l.s)) && visible(MAP.get(l.t));
    l.el.setAttribute('opacity', on && vis ? 1 : (focus ? .08 : (vis ? .75 : .06)));
    l.el.setAttribute('stroke', on && focus ? '#a5b4fc' : '#cfd8e8');
    l.el.setAttribute('stroke-width', on && focus ? 1.9 : 1.1);
  }
}

/* ---------- detail panel ---------- */
const SHEETBAR = '<div class="sheet-bar"><span class="sheet-grip"></span><button class="sheet-close" type="button">收起</button></div>';
function bindSheet(d){
  const b = d.querySelector('.sheet-close');
  if(b) b.onclick = () => { sel = null; document.body.classList.remove('sheet'); updateHighlight(); renderDetail(); };
}

function renderDetail(){
  const d = $('#detail');
  if(!sel){
    const cats = G.cats.map(c => `${c.name} ${NODES.filter(n=>n.cat===c.id).length}`).join(' · ');
    d.innerHTML = SHEETBAR + `
      <div class="d-empty">
        <h3>${esc(G.title)}</h3>
        <p>${esc(G.subtitle)}</p>
        <p style="font-size:11.5px;color:#94a3b8">${esc(cats)}</p>
        <div class="rel-title">提示</div>
        <p style="font-size:12px">点击任意节点查看定义、2026 年现状与关联脉络。左侧可切换图层，顶部搜索框支持关键词定位。</p>
      </div>`;
    bindSheet(d);
    return;
  }
  const n = MAP.get(sel);
  if(!n) return;
  const cat = catOf(n.cat);
  const rels = (ADJ.get(n.id) || []).map(id => MAP.get(id)).filter(Boolean);
  d.innerHTML = SHEETBAR + `
    <div class="badge" style="background:${cat.color}1a;color:${cat.color}"><i style="background:${cat.color}"></i>${esc(cat.name)}</div>
    <div class="d-title">${esc(n.label)}</div>
    <div class="d-desc">${esc(n.d || '')}</div>
    ${n.m && n.m.length ? `<div class="d-meta">${n.m.map(x => '· ' + esc(x)).join('<br>')}</div>` : ''}
    ${n.k && n.k.length ? `<div class="kw">${n.k.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    <div class="rel-title">关联 ${rels.length}</div>
    ${rels.map(r => {
      const rc = catOf(r.cat);
      return `<div class="rel" data-go="${r.id}"><i style="background:${rc.color}"></i>${esc(r.label)}<span class="dirmark">→</span></div>`;
    }).join('')}
  `;
  d.querySelectorAll('[data-go]').forEach(x => {
    x.onclick = () => { selectNode(x.dataset.go, true); };
  });
  bindSheet(d);
}

/* ---------- select ---------- */
function selectNode(id, focusIt){
  sel = (sel === id) ? null : id;
  if(focusIt && sel){
    const n = MAP.get(sel);
    const W = svg.clientWidth, H = svg.clientHeight;
    const target = Math.max(view.s, .85);
    view.s = target;
    view.x = W / 2 - n.x * target;
    view.y = H / 2 - n.y * target;
    applyView();
  }
  updateHighlight();
  renderDetail();
  document.body.classList.toggle('sheet', !!sel);
}

/* ---------- graph loading ---------- */
function loadGraph(key){
  G = GRAPHS[key];
  NODES = G.nodes.map(n => ({...n}));
  LINKS = G.links.map(l => [l[0], l[1]]);
  MAP = new Map(NODES.map(n => [n.id, n]));
  ADJ = new Map(NODES.map(n => [n.id, []]));
  for(const [s, t] of LINKS){
    if(ADJ.has(s) && ADJ.has(t)){ ADJ.get(s).push(t); ADJ.get(t).push(s); }
  }
  sel = null; hover = null; q = ''; $('#q').value = '';
  activeCats = new Set();

  if(G.layout === 'layered') layoutLayered(); else layoutRadial();

  renderLegend(); renderStats(); renderTabs(); renderDetail();
  render();
  fit();
}

/* ---------- chrome ---------- */
function renderTabs(){
  const t = $('#tabs');
  t.innerHTML = '';
  Object.keys(GRAPHS).forEach((k, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + ' · ' + GRAPHS[k].tab;
    b.className = (GRAPHS[k] === G) ? 'on' : '';
    b.onclick = () => loadGraph(k);
    t.appendChild(b);
  });
}
function renderLegend(){
  const boxes = [$('#legend'), $('#mlegend')].filter(Boolean);
  boxes.forEach(b => { b.innerHTML = ''; });
  for(const c of G.cats){
    const count = NODES.filter(n => n.cat === c.id).length;
    for(const box of boxes){
      const row = document.createElement('div');
      row.className = 'leg' + (activeCats.has(c.id) ? ' off' : '');
      row.innerHTML = `<span class="dot" style="background:${c.color}"></span>
        <span class="nm">${esc(c.name)}</span><span class="ct">${count}</span>`;
      row.onclick = () => {
        if(activeCats.has(c.id)) activeCats.delete(c.id); else activeCats.add(c.id);
        renderLegend(); updateHighlight();
      };
      box.appendChild(row);
    }
  }
}
function renderStats(){
  const st = $('#stats');
  const d1 = NODES.filter(n => n.depth === 1).length;
  st.innerHTML = `
    <div class="stat"><span class="k">节点</span><span class="v">${NODES.length}</span></div>
    <div class="stat"><span class="k">关系</span><span class="v">${LINKS.length}</span></div>
    <div class="stat"><span class="k">图层</span><span class="v">${G.cats.length}</span></div>
    <div class="stat"><span class="k">版本核对</span><span class="v">2026-10-25</span></div>`;
}

/* ---------- interaction ---------- */
let drag = null;

svg.addEventListener('pointerdown', e => {
  const gEl = e.target.closest('.node');
  if(gEl){
    const id = gEl.dataset.id;
    const n = MAP.get(id);
    drag = {type:'node', id, n, moved:false};
    gEl.parentNode.appendChild(gEl);
    e.preventDefault();
  } else {
    drag = {type:'canvas', sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y};
  }
});

window.addEventListener('pointermove', e => {
  if(!drag) return;
  if(drag.type === 'node'){
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left - view.x) / view.s;
    const my = (e.clientY - rect.top - view.y) / view.s;
    drag.n.x = mx; drag.n.y = my;
    drag.moved = true;
    const o = nodeEls.get(drag.id);
    if(o) o.g.setAttribute('transform', `translate(${mx},${my})`);
    for(const l of linkEls){
      if(l.s === drag.id){ l.el.setAttribute('x1', mx); l.el.setAttribute('y1', my); }
      if(l.t === drag.id){ l.el.setAttribute('x2', mx); l.el.setAttribute('y2', my); }
    }
  } else {
    view.x = drag.ox + (e.clientX - drag.sx);
    view.y = drag.oy + (e.clientY - drag.sy);
    applyView();
  }
});

window.addEventListener('pointerup', e => {
  if(drag && drag.type === 'node' && !drag.moved) selectNode(drag.id, false);
  drag = null;
});

svg.addEventListener('dblclick', e => {
  const gEl = e.target.closest('.node');
  if(gEl) selectNode(gEl.dataset.id, true);
});

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.max(.12, Math.min(3.2, view.s * factor));
  const k = ns / view.s;
  view.x = mx - (mx - view.x) * k;
  view.y = my - (my - view.y) * k;
  view.s = ns;
  applyView();
}, {passive:false});

// hover
svg.addEventListener('pointerover', e => {
  const gEl = e.target.closest('.node');
  if(!gEl) return;
  hover = gEl.dataset.id;
  updateHighlight();
});
svg.addEventListener('pointerout', e => {
  const gEl = e.target.closest('.node');
  if(!gEl) return;
  if(e.relatedTarget && gEl.contains(e.relatedTarget)) return;
  hover = null;
  updateHighlight();
});

// toolbar
document.querySelectorAll('.toolbar button').forEach(b => {
  b.onclick = () => {
    if(b.dataset.act === 'fit') fit();
    else { loadGraph(Object.keys(GRAPHS).find(k => GRAPHS[k] === G)); }
  };
});

// search
$('#q').addEventListener('input', e => {
  q = e.target.value;
  updateHighlight();
});

// keyboard
window.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  const keys = Object.keys(GRAPHS);
  const idx = keys.findIndex(k => GRAPHS[k] === G);
  if(e.key === '1' && keys[0]) loadGraph(keys[0]);
  if(e.key === '2' && keys[1]) loadGraph(keys[1]);
  if(e.key === '3' && keys[2]) loadGraph(keys[2]);
  if(e.key === 'f') fit();
  if(e.key === 'Escape'){ sel = null; updateHighlight(); renderDetail(); }
});

window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if(NODES.length) fit(); }, 160);
});

$('#btnPng').onclick = () => {
  // export the whole graph, not just the current viewport
  const saved = {s:view.s, x:view.x, y:view.y};
  fit();
  const W = svg.clientWidth * 2, H = svg.clientHeight * 2;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', NS);
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);
  clone.setAttribute('viewBox', `0 0 ${svg.clientWidth} ${svg.clientHeight}`);
  const bg = mk('rect', {x:0, y:0, width:'100%', height:'100%', fill:'#fbfcff'});
  clone.insertBefore(bg, clone.firstChild);

  const str = new XMLSerializer().serializeToString(clone);
  view.s = saved.s; view.x = saved.x; view.y = saved.y; applyView();
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fbfcff'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    const a = document.createElement('a');
    a.download = 'AI-KG-2026-' + G.tab + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
};

/* ---------- mobile: move PNG export into the canvas toolbar ---------- */
function placeExport(){
  const btn = $('#btnPng');
  if(!btn) return;
  const bar = document.querySelector('.toolbar');
  const small = window.matchMedia('(max-width: 880px)').matches;
  const inBar = btn.parentNode && btn.parentNode.classList.contains('toolbar');
  if(small && !inBar) bar.appendChild(btn);
  else if(!small && inBar) document.querySelector('.topbar').appendChild(btn);
}
window.addEventListener('resize', placeExport);

/* ---------- boot ---------- */
(function(){
  const sp = new URLSearchParams(location.search);
  const p = sp.get('g');
  loadGraph(p && GRAPHS[p] ? p : 'panorama');
  placeExport();
  const nid = sp.get('n');
  if(nid && MAP.has(nid)) selectNode(nid, true);
  if(sp.get('clean') === '1'){
    document.body.classList.add('clean');
    requestAnimationFrame(() => { fit(); setTimeout(fit, 120); });
  }
})();
</script>
